<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Details | Work Flow</title><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="portal.js"></script></head><body><div class="top"><span>🇦🇪 UAE's Trusted Recruitment & Business Services</span><span>workflow2451@gmail.com</span></div><nav class="nav"><a class="brand" href="index.html"><img src="logo.png"><b>WORK <span>FLOW</span></b></a><div class="navlinks"><a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="dashboard.html">Dashboard</a></div><div class="auth"><a class="btn outline" id="loginBtn" href="login.html">🔐 Login</a><a class="btn" id="signupBtn" href="signup.html">✨ Sign Up</a><span id="authUser" style="display:none"></span><a class="btn outline" id="dashboardBtn" style="display:none" href="dashboard.html">👤 Dashboard</a><button class="btn outline" id="logoutBtn" style="display:none">🚪 Logout</button></div></nav><main class="wrap"><div id="job" class="card">Loading job…</div></main><script>(async()=>{const sb=wfClient(),id=new URLSearchParams(location.search).get('id');if(!id){job.innerHTML='<div class="notice">Job not found.</div>';return}const r=await sb.from('jobs').select('*').eq('id',id).single();if(r.error){job.innerHTML='<div class="notice">'+esc(r.error.message)+'</div>';return}const j=r.data;const u=await wfUser();let saved=false;if(u){const s=await sb.from('saved_jobs').select('job_id').eq('user_id',u.id).eq('job_id',id).maybeSingle();saved=!!s.data}job.innerHTML=`<div class="meta"><span>${esc(j.location)}</span><span class="tag">${esc(j.job_type)}</span><span>${j.salary_min?'AED '+Number(j.salary_min).toLocaleString():''}${j.salary_max?' – '+Number(j.salary_max).toLocaleString():''}</span></div><h1>${esc(j.title)}</h1><h3>${esc(j.company)}</h3><p style="color:var(--muted)">${esc(j.category)} · ${esc(j.experience||'Experience not specified')}</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Job Description</h2><p>${esc(j.description||'No description provided.').replace(/\n/g,'<br>')}</p><h2>Requirements</h2><p>${esc(j.requirements||'Contact Work Flow for requirements.').replace(/\n/g,'<br>')}</p><div class="actions"><button class="btn" id="applyBtn">📄 Apply Now</button><button class="btn outline" id="saveBtn">⭐ ${saved?'Saved':'Save Job'}</button></div><div id="msg" class="msg"></div>`;applyBtn.onclick=()=>{if(!u){location.href='login.html?next='+encodeURIComponent('job-details.html?id='+id);return}location.href='apply.html?job_id='+encodeURIComponent(id)};saveBtn.onclick=async()=>{const user=await wfUser();if(!user){location.href='login.html?next='+encodeURIComponent('job-details.html?id='+id);return}if(saved){await sb.from('saved_jobs').delete().eq('user_id',user.id).eq('job_id',id);saved=false;saveBtn.textContent='⭐ Save Job'}else{const x=await sb.from('saved_jobs').insert({user_id:user.id,job_id:id});if(!x.error){saved=true;saveBtn.textContent='⭐ Saved'}}};})();</script></body></html>
