<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | Work Flow</title><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="portal.js"></script></head><body><main class="wrap" style="max-width:760px"><div class="card"><a class="brand" href="jobs.html"><img src="logo.png"><b>WORK <span>FLOW</span></b></a><div id="formArea"><h1>Complete Your Application</h1><div id="jobBox" class="notice">Loading job…</div><form id="applyForm"><div class="form-grid"><div class="field"><label>Full Name</label><input id="candidateName" required></div><div class="field"><label>Phone</label><input id="candidatePhone" required placeholder="+971..."></div><div class="field full"><label>CV</label><input id="cv" type="file" accept=".pdf,.doc,.docx" required></div></div><div class="notice">Your application is submitted only after you press Submit Application. You must be logged in.</div><button class="btn" id="submit">📄 Submit Application</button><div id="msg" class="msg"></div></form></div></div></main><script>(async()=>{const u=await guard('apply.html'+location.search);if(!u)return;const sb=wfClient(),id=new URLSearchParams(location.search).get('job_id');if(!id){jobBox.textContent='Job not found.';applyForm.style.display='none';return}const jr=await sb.from('jobs').select('*').eq('id',id).single();if(jr.error){jobBox.textContent=jr.error.message;applyForm.style.display='none';return}const j=jr.data;jobBox.innerHTML=`<b>${esc(j.title)}</b><br>${esc(j.company)} · ${esc(j.location)} · ${esc(j.job_type)}`;candidateName.value=u.user_metadata?.full_name||'';candidatePhone.value=u.user_metadata?.phone||'';applyForm.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const f=cv.files[0];if(!f||f.size>8*1024*1024){msg.textContent='Please select a CV up to 8 MB.';msg.style.display='block';submit.disabled=false;return}const ext=f.name.split('.').pop().toLowerCase(),path=u.id+'/'+Date.now()+'.'+ext;const up=await sb.storage.from('candidate-cvs').upload(path,f,{upsert:true});if(up.error){msg.textContent=up.error.message+' — run work_flow_portal.sql in Supabase.';msg.style.display='block';submit.disabled=false;return}const ins=await sb.from('applications').insert({user_id:u.id,job_id:j.id,job_title:j.title,status:'Applied',candidate_name:candidateName.value.trim(),phone:candidatePhone.value.trim(),cv_path:path}).select('id').single();if(ins.error){msg.textContent=ins.error.message;msg.style.display='block';submit.disabled=false;return}location.href='application-success.html?id='+ins.data.id})();})();</script></body></html>
