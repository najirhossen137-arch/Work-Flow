<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply for Job | Work Flow</title><link rel="icon" href="logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f8fb;color:#10213a;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border-radius:20px;padding:35px;box-shadow:0 18px 60px #061b3820;text-align:center;border:1px solid #e2eaf1}.logo{width:78px;height:78px;object-fit:contain}.brand{font-weight:900;font-size:28px;margin:8px}.brand span{color:#10b7c7}.job{background:#eef8fa;border-radius:12px;padding:15px;margin:20px 0;color:#0b6170;font-weight:800}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:9px;background:#10b7c7;color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}.btn.dark{background:#061b38}.muted{color:#66758a}.hidden{display:none}</style></head><body><main class="card"><img class="logo" src="logo.png" alt="Work Flow"><div class="brand">WORK <span>FLOW</span></div><h1>Complete Your Application</h1><p class="muted">You are signed in. Continue to WhatsApp to apply for this job.</p><div id="job" class="job">Loading job…</div><button id="continue" class="btn" disabled>Continue to WhatsApp</button><p id="error" class="muted hidden"></p><p><a class="muted" href="jobs.html">← Back to Job Vacancies</a></p><p class="muted" style="font-size:13px">Login is required before applying for any vacancy.</p></main><script>(async()=>{const params=new URLSearchParams(location.search);const job=params.get('job')||'Job Vacancy';const jobEl=document.getElementById('job'),btn=document.getElementById('continue'),err=document.getElementById('error');jobEl.textContent=job;try{const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data}=await sb.auth.getSession();if(!data.session){location.replace('login.html?next='+encodeURIComponent('apply.html?job='+job));return}btn.disabled=false;btn.onclick=()=>{location.href='https://wa.me/971502467038?text='+encodeURIComponent('I want to apply for '+job)};}catch(e){err.textContent='Authentication could not be verified. Please log in again.';err.classList.remove('hidden');}})();</script></body></html>
