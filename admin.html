<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Admin | Work Flow</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#10213a}.wrap{max-width:1000px;margin:auto;padding:30px 16px}.card{background:#fff;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 5px 25px #061b3810}.review{border:1px solid #dde5ee;padding:18px;border-radius:10px;margin:12px 0}.muted{color:#66758a}.btn{padding:12px 16px;border:0;border-radius:7px;background:#10b7c7;color:#fff;font-weight:700}.danger{background:#d9534f}</style></head><body><div class="wrap"><div class="card"><h1>⭐ Work Flow Review Admin</h1><p class="muted">Approved reviews stored in Supabase are shown below.</p><a href="reviews.html">View public reviews</a></div><div class="card"><h2>Reviews</h2><div id="list">Loading...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let sb;function db(){if(!sb)sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return sb}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){try{const {data,error}=await db().from('reviews').select('idid,created_at,nameName,location,rating,review,status').order('created_at',{ascending:false});if(error)throw error;document.getElementById('list').innerHTML=data?.length?data.map(r=>`<div class="review"><b>${esc(r.nameName)}</b> — ${Number(r.rating)||0}/5<br><span class="muted">${esc(r.location||'')} · ${esc(r.status||'')}</span><p>${esc(r.review)}</p></div>`).join(''):'<p class="muted">No reviews found.</p>'}catch(e){document.getElementById('list').innerHTML='<p style="color:#b22">Could not load reviews. Check Supabase config and SELECT policy.</p>'}}load();
</script></body></html>
