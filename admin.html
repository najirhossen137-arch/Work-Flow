<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Admin | Work Flow</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#10213a}.wrap{max-width:1000px;margin:auto;padding:30px 16px}.card{background:#fff;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 5px 25px #061b3810}input,button{padding:12px;border-radius:7px;border:1px solid #ccd7e4;font:inherit}button{background:#10b7c7;color:#fff;border:0;cursor:pointer;font-weight:700}.danger{background:#d9534f}.approve{background:#168b63}.review{border:1px solid #dde5ee;padding:18px;border-radius:10px;margin:12px 0}.muted{color:#66758a}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:#10a7b5}</style></head><body><div class="wrap"><div class="top"><h1>⭐ Work Flow Review Admin</h1><a href="reviews.html">View Reviews</a></div><div id="login" class="card"><h2>Admin Login</h2><p class="muted">This static version stores reviews in this browser only.</p><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="err" style="color:#d9534f"></p></div><div id="panel" class="hidden"><div class="card"><div class="top"><h2>Pending Reviews</h2><button onclick="logout()">Logout</button></div><div id="pending"></div></div><div class="card"><h2>Approved Reviews</h2><div id="approved"></div></div></div></div><script>const KEY='work_flow_admin_reviews_v1';const RKEY='workflow_reviews_v1';const PASS='1234';function seed(){let x=localStorage.getItem(RKEY);if(!x)localStorage.setItem(RKEY,JSON.stringify([{name:'Candidate',location:'UAE',rating:5,text:'Professional support and quick communication throughout the job process.',status:'approved'},{name:'Job Seeker',location:'Dubai',rating:5,text:'The team was helpful and explained the application process clearly.',status:'approved'},{name:'Client',location:'UAE',rating:5,text:'Good communication and professional recruitment service.',status:'approved'}]))}function get(){try{return JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){return[]}}function save(x){localStorage.setItem(RKEY,JSON.stringify(x))}function login(){if(document.getElementById('pass').value===PASS){sessionStorage.setItem(KEY,'1');show()}else document.getElementById('err').textContent='Wrong password.'}function logout(){sessionStorage.removeItem(KEY);location.reload()}function show(){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');render()}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function card(x,i,actions){return `<div class="review"><div>★★★★★</div><h3>${esc(x.name)} <span class="muted">(${Number(x.rating)||5}/5)</span></h3><div class="muted">${esc(x.location)}</div><p>“${esc(x.text)}”</p>${actions?`<button class="approve" onclick="approve(${i})">Approve</button> <button class="danger" onclick="removeReview(${i})">Reject / Delete</button>`:`<button class="danger" onclick="removeReview(${i})">Delete</button>`}</div>`}function render(){const x=get();document.getElementById('pending').innerHTML=x.filter(r=>r.status==='pending').map((r)=>card(r,x.indexOf(r),true)).join('')||'<p class="muted">No pending reviews.</p>';document.getElementById('approved').innerHTML=x.filter(r=>r.status==='approved').map((r)=>card(r,x.indexOf(r),false)).join('')||'<p class="muted">No approved reviews.</p>'}function approve(i){let x=get();x[i].status='approved';save(x);render()}function removeReview(i){if(confirm('Delete this review?')){let x=get();x.splice(i,1);save(x);render()}}seed();if(sessionStorage.getItem(KEY)==='1')show();</script></body></html>
