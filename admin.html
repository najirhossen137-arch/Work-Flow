<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Flow - Review Admin</title>
<style>
body{font-family:Arial;margin:0;background:#eef6fa;color:#14253b}main{max-width:1100px;margin:30px auto;padding:20px}.card{background:#fff;padding:20px;border-radius:14px;margin:12px 0;border:1px solid #dfe7ef}
button{padding:9px 14px;border:0;border-radius:7px;margin-right:7px;font-weight:700} .approve{background:#18a66a;color:white}.reject{background:#d9534f;color:white}.muted{color:#68788a}
</style>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>function getSupabase(){if(!window.__sb)window.__sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);return window.__sb}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function load(){const el=document.getElementById("list");el.innerHTML="Loading...";const {data,error}=await getSupabase().from("reviews").select("*").order("created_at",{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=data.map(r=>`<div class="card"><b>${esc(r.nameName||"Anonymous")}</b> <span class="muted">${esc(r.location||"")}</span><div>${"★".repeat(Number(r.rating)||0)}</div><p>${esc(r.review||"")}</p><p class="muted">Status: ${esc(r.status||"")}</p><button class="approve" onclick="setStatus(${Number(r.idid)} ,'approved')">Approve</button><button class="reject" onclick="setStatus(${Number(r.idid)},'rejected')">Reject</button></div>`).join("")||"No reviews found"}
async function setStatus(id,status){const {error}=await getSupabase().from("reviews").update({status}).eq("idid",id);if(error)alert(error.message);else load()}
document.addEventListener("DOMContentLoaded",load)</script></head>
<body><main><h1>Work Flow Review Admin</h1><p class="muted">Approve reviews here. Approved reviews are shown publicly.</p><div id="list"></div></main></body></html>
