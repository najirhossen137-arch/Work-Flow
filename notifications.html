<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Work Flow</title><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="portal.js"></script></head><body><main class="wrap" style="max-width:850px"><div class="card"><a href="dashboard.html">← Dashboard</a><h1>🔔 Notifications</h1><div id="list">Loading…</div></div></main><script>(async()=>{const u=await guard('notifications.html');if(!u)return;const sb=wfClient();const r=await sb.from('notifications').select('*').eq('user_id',u.id).order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="notice">Run work_flow_portal.sql in Supabase.</div>';return}list.innerHTML=(r.data||[]).map(n=>`<div class="application"><div><b>${esc(n.title)}</b><p style="margin:5px 0;color:var(--muted)">${esc(n.message)}</p><small style="color:var(--muted)">${new Date(n.created_at).toLocaleString()}</small></div><span class="status">${n.is_read?'Read':'New'}</span></div>`).join('')||'<div class="notice">No notifications yet.</div>';await sb.from('notifications').update({is_read:true}).eq('user_id',u.id)})();</script></body></html>
