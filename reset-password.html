<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Work Flow</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head><body><main class="auth-page"><section class="auth-brand"><img src="logo.png" alt="Work Flow"><h1>Create a new <span>password</span></h1><p>Choose a strong password to keep your Work Flow account secure.</p></section><section class="auth-form-wrap"><a class="back" href="login.html">← Back to Login</a><h2>New Password</h2><p class="subtitle">Enter your new password below.</p><form onsubmit="doReset(event)"><div class="field"><label for="password">New password</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6" required><button class="toggle" type="button" onclick="togglePassword()">👁</button></div></div><button class="btn" type="submit">🔒 Update Password</button><div id="message" class="message"></div></form></section></main></body></html>
