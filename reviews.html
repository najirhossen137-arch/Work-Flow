<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Reviews - Work Flow</title>
<style>
:root{--navy:#061a35;--teal:#16b7c7;--muted:#65758a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef6fa;color:#15253b}
header{background:#061a35;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
header a{color:white;text-decoration:none;margin-left:18px}
main{max-width:1000px;margin:40px auto;padding:0 20px}
h1{text-align:center}.teal{color:var(--teal)}
.review-form-box{background:white;padding:28px;border-radius:16px;margin:30px auto;max-width:760px}
form{display:grid;gap:12px}input,select,textarea{width:100%;padding:13px;border:1px solid #ccd6e2;border-radius:8px;font:inherit}
textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{padding:13px 20px;border:0;border-radius:8px;background:var(--teal);color:white;font-weight:700}
.review-status{display:none;padding:11px;border-radius:8px}.review-list{display:grid;gap:14px}
.review-card{background:white;border:1px solid #e1e8ef;border-radius:14px;padding:20px}
.review-top{display:flex;justify-content:space-between;gap:15px}.review-name{font-weight:800}.review-stars{letter-spacing:2px}.review-location,.review-date{font-size:13px;color:var(--muted);margin-top:4px}.review-text{margin-top:12px;line-height:1.5}.review-empty{text-align:center;color:var(--muted);padding:20px}
@media(max-width:600px){.row{grid-template-columns:1fr}header{display:block}header nav{margin-top:12px}header a{margin:0 12px 0 0}}
</style>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function getSupabase(){
  if(!window.__sb) window.__sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return window.__sb;
}
</script>
<script src="reviews.js"></script>
<style id="wf-v10-design">
/* WORK FLOW V10 — PREMIUM MIDNIGHT + GOLD REDESIGN */
:root{--navy:#07111f;--navy2:#0d1d31;--teal:#17b8c8;--cyan:#55e1e8;--gold:#d7b46a;--gold2:#f0d58e;--ink:#101d2d;--muted:#718096;--bg:#f4f7fb;--white:#fff;--line:#e4eaf1}
html{scroll-behavior:smooth}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important;background:linear-gradient(180deg,#f7f9fc,#eef3f8)!important;color:var(--ink)!important}
.top{background:linear-gradient(90deg,#050b14,#0c1b2e)!important;color:#dfe8f2!important;border-bottom:1px solid #ffffff12!important;padding:8px 5%!important}
nav,.nav{background:rgba(255,255,255,.96)!important;backdrop-filter:blur(14px);box-shadow:0 8px 28px #08111f12!important;border-bottom:1px solid #e7edf3!important}
.brand b,.brand-copy b{color:#0a1a2e!important;letter-spacing:-.5px}.brand span,.brand-copy span{color:var(--teal)!important}
.navlinks a,.links a{color:#1b2a3d!important}.navlinks a:hover,.links a:hover{color:var(--teal)!important}
.btn{border-radius:12px!important;background:linear-gradient(135deg,#16b5c5,#0d98a8)!important;box-shadow:0 8px 18px #0a9baa22!important;transition:.2s transform,.2s box-shadow}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px #0a9baa33!important}.btn.dark{background:linear-gradient(135deg,#0b1b30,#142b47)!important}.btn.outline,.btn.outline-dark{background:#fff!important;color:#10213a!important;border:1px solid #d8e0e9!important;box-shadow:none!important}
.hero{background:radial-gradient(circle at 78% 28%,#1b5266aa 0,#0b1c30aa 32%,#040b15eF 72%),linear-gradient(135deg,#040b15,#102944)!important;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-160px;top:-160px;width:520px;height:520px;border:1px solid #d7b46a55;border-radius:50%;box-shadow:0 0 0 55px #d7b46a08,0 0 0 110px #d7b46a05}.hero-inner{position:relative;z-index:2}.eyebrow{color:var(--gold2)!important;letter-spacing:3px}.hero h1{letter-spacing:-2px}.hero h1 span{color:var(--cyan)!important}.hero p{color:#d9e4ef!important}.stats{background:#081727cc!important;border:1px solid #d7b46a33!important;box-shadow:0 18px 50px #0004}.stat strong{color:var(--gold2)!important}
.section{max-width:1280px}.section h2{letter-spacing:-1px}.card,.feature,.job-card,.job,.review-box,.review-card,.about{border:1px solid var(--line)!important;border-radius:20px!important;box-shadow:0 12px 35px #13253b0b!important;background:rgba(255,255,255,.94)!important}.feature{transition:.2s transform,.2s box-shadow}.feature:hover{transform:translateY(-5px);box-shadow:0 18px 35px #13253b16!important}.icon{color:var(--teal)!important}.tag{background:#eef9fa!important;color:#078895!important;border:1px solid #d8f0f2}
.hero-mini{background:linear-gradient(135deg,#07111f,#163653)!important;color:#fff!important;border-radius:24px!important;padding:55px 32px!important;box-shadow:0 18px 45px #07111f22}.hero-mini h1{letter-spacing:-1px}.filters{background:#fff!important;padding:18px!important;border-radius:16px!important}.filters input,.filters select,.review-form input,.review-form select,.review-form textarea,.auth-card input{border:1px solid #d7e0e9!important;border-radius:11px!important;outline:none}.filters input:focus,.filters select:focus,.review-form input:focus,.review-form textarea:focus,.auth-card input:focus{border-color:#16b5c5!important;box-shadow:0 0 0 3px #16b5c514}
.side{background:linear-gradient(145deg,#07111f,#163653)!important;border:1px solid #d7b46a33}.contact{background:linear-gradient(135deg,#050c15,#0e263e)!important}.footer{background:#050c15!important;border-top:1px solid #d7b46a22}.wa{background:#18b96b!important}
.auth-card{border:1px solid #dbe3eb!important;border-radius:22px!important}.auth-card h2{color:#0b1b30!important}.review-box{background:linear-gradient(180deg,#fff,#f8fbfd)!important}.review-stars{color:#d7a83f!important}.reviews-section{background:linear-gradient(180deg,#eef5f8,#f7f9fc)!important}
/* dashboard / profile cards */
main .card.section{border-radius:22px!important}.notice,.msg{border-radius:12px!important;border:1px solid #d9e8ef!important;background:#eef9fb!important}.application{border:1px solid #e2e9f0!important;border-radius:14px!important;padding:14px!important;margin:10px 0!important;background:#fff!important}
@media(max-width:700px){.hero h1{font-size:clamp(40px,11vw,58px)!important}.hero{min-height:620px!important}.section{padding:52px 18px!important}.hero-mini{padding:40px 22px!important}.card.section{padding:22px!important}.brand{max-width:none}}
</style></head>
<body>
<header><strong>WORK <span style="color:#16b7c7">FLOW</span></strong><nav><a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="reviews.html">Reviews</a></nav></header>
<main>
<h1>CUSTOMER <span class="teal">REVIEWS</span></h1>
<div class="review-form-box">
<h2>Write a Review</h2>
<p>Your review will stay pending until it is approved by Work Flow.</p><div id="authNotice" style="background:#eef8fa;border:1px solid #cdebef;padding:12px;border-radius:8px;margin:12px 0;display:none">🔐 Please <a href="login.html?next=reviews.html" style="color:#078a97;font-weight:700">Log in</a> or <a href="signup.html?next=reviews.html" style="color:#078a97;font-weight:700">Sign Up</a> to submit a review.</div>
<form id="reviewForm" style="display:none">
<input id="reviewName" name="name" required placeholder="Your Name">
<input id="reviewLocation" name="location" placeholder="City / Country (optional)">
<select id="reviewRating" name="rating" required>
<option value="">Select Rating</option><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option>
</select>
<textarea id="reviewText" name="review" required placeholder="Write your review"></textarea>
<button type="submit">⭐ Submit Review</button>
<div class="review-status" id="reviewMsg"></div>
</form>
</div>
<div id="reviewList" class="review-list"><div class="review-empty">Loading reviews...</div></div>
</main>
<script>
document.addEventListener("DOMContentLoaded",async function(){
  loadApprovedReviews("#reviewList");
  try{
    const client=getSupabase();
    const {data}=await client.auth.getSession();
    const form=document.getElementById("reviewForm"), notice=document.getElementById("authNotice");
    if(data.session){ form.style.display="grid"; setupReviewForm(form); }
    else { notice.style.display="block"; }
  }catch(e){ document.getElementById("authNotice").style.display="block"; }
});
</script>
</body>
</html>
