<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Reviews - Work Flow</title>
<style>
:root{--navy:#061a35;--teal:#16b7c7;--muted:#65758a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef6fa;color:#15253b}
header{background:#061a35;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
header a{color:white;text-decoration:none;margin-left:18px}
main{max-width:1000px;margin:40px auto;padding:0 20px}
h1{text-align:center}.teal{color:var(--teal)}
.review-form-box{background:white;padding:28px;border-radius:16px;margin:30px auto;max-width:760px}
form{display:grid;gap:12px}input,select,textarea{width:100%;padding:13px;border:1px solid #ccd6e2;border-radius:8px;font:inherit}
textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{padding:13px 20px;border:0;border-radius:8px;background:var(--teal);color:white;font-weight:700}
.review-status{display:none;padding:11px;border-radius:8px}.review-list{display:grid;gap:14px}
.review-card{background:white;border:1px solid #e1e8ef;border-radius:14px;padding:20px}
.review-top{display:flex;justify-content:space-between;gap:15px}.review-name{font-weight:800}.review-stars{letter-spacing:2px}.review-location,.review-date{font-size:13px;color:var(--muted);margin-top:4px}.review-text{margin-top:12px;line-height:1.5}.review-empty{text-align:center;color:var(--muted);padding:20px}
@media(max-width:600px){.row{grid-template-columns:1fr}header{display:block}header nav{margin-top:12px}header a{margin:0 12px 0 0}}
.btn.outline-dark{background:#fff;color:var(--navy);border:1px solid var(--navy)}
</style>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function getSupabase(){
  if(!window.__sb) window.__sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return window.__sb;
}
</script>
<script src="reviews.js"></script>
</head>
<body>
<header><strong>WORK <span style="color:#16b7c7">FLOW</span></strong><nav><a href="index.html">Home</a><a href="jobs.html">Jobs</a><a href="reviews.html">Reviews</a></nav></header>
<main>
<h1>CUSTOMER <span class="teal">REVIEWS</span></h1>
<div class="review-form-box">
<h2>Write a Review</h2>
<p>Your review will stay pending until it is approved by Work Flow.</p>
<form id="reviewForm">
<input id="reviewName" name="name" required placeholder="Your Name">
<input id="reviewLocation" name="location" placeholder="City / Country (optional)">
<select id="reviewRating" name="rating" required>
<option value="">Select Rating</option><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option>
</select>
<textarea id="reviewText" name="review" required placeholder="Write your review"></textarea>
<button type="submit">⭐ Submit Review</button>
<div class="review-status" id="reviewMsg"></div>
</form>
</div>
<div id="reviewList" class="review-list"><div class="review-empty">Loading reviews...</div></div>
</main>
<script>
document.addEventListener("DOMContentLoaded",function(){
  setupReviewForm(document.getElementById("reviewForm"));
  loadApprovedReviews("#reviewList");
});
</script>
</body>
</html>
